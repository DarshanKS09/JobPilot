<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobPilot</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: #0f172a;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .section {
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid #dbe3f0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fff;
      }

      .job-preview {
        font-size: 12px;
        color: #475569;
        word-break: break-word;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        padding: 10px;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #saveSettings {
        width: 100%;
        background: #0f172a;
        color: #fff;
      }

      #confirmButton {
        background: #16a34a;
        color: #fff;
      }

      #discardButton {
        background: #e2e8f0;
        color: #0f172a;
      }

      #status {
        min-height: 18px;
        margin: 10px 0 0;
        font-size: 12px;
        color: #475569;
      }

      #status.success {
        color: #166534;
      }

      #status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>JobPilot</h1>

    <div class="section">
      <label class="label" for="tokenInput">JWT Token</label>
      <input id="tokenInput" type="password" placeholder="Paste your JWT token" />

      <label class="label" for="apiBaseUrlInput">API Base URL</label>
      <input id="apiBaseUrlInput" type="url" placeholder="http://localhost:3000" />

      <button id="saveSettings" type="button">Save Settings</button>
    </div>

    <div class="section">
      <label class="label" for="titleInput">Job Title</label>
      <input id="titleInput" type="text" placeholder="Detected role" />

      <label class="label" for="companyInput">Company</label>
      <input id="companyInput" type="text" placeholder="Detected company" />

      <label class="label" for="urlInput">Job URL</label>
      <input id="urlInput" type="url" placeholder="https://company.com/job" />

      <div id="urlPreview" class="job-preview">No job detected yet.</div>
    </div>

    <div class="actions">
      <button id="confirmButton" type="button">YES</button>
      <button id="discardButton" type="button">NO</button>
    </div>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
